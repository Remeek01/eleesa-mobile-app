name: Shorebird Android & iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose "release" for baseline APK/IPA or "patch" for live OTA update'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - release

jobs:
  android:
    name: Android (${{ github.event.inputs.mode || 'patch' }})
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: shorebirdtech/setup-shorebird@v1
      - name: Build Android Release APK
        if: github.event.inputs.mode == 'release'
        run: shorebird release android --artifact apk --flutter-version=3.47.9
      - name: Upload Android Release APK
        if: github.event.inputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Push Android Live OTA Patch
        if: github.event.inputs.mode != 'release'
        run: shorebird patch --platforms=android

  ios:
    name: iOS (${{ github.event.inputs.mode || 'patch' }})
    runs-on: macos-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: shorebirdtech/setup-shorebird@v1
      - name: Build iOS Release IPA
        if: github.event.inputs.mode == 'release'
        run: |
          shorebird release ios --no-codesign --flutter-version=3.47.9
          mkdir -p build/ios/ipa/Payload
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
          else
            cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          fi
          cd build/ios/ipa && zip -r eleesa_app.ipa Payload
      - name: Upload iOS Release IPA
        if: github.event.inputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/eleesa_app.ipa
      - name: Push iOS Live OTA Patch
        if: github.event.inputs.mode != 'release'
        run: shorebird patch --platforms=ios --no-codesign